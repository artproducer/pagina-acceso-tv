<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b1020">
  <title>Continuar acceso en tu televisor</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #070a12;
      --surface: #101625;
      --surface-soft: #151d30;
      --border: #26324a;
      --text: #f5f7fb;
      --muted: #aab4c8;
      --accent: #5b7cfa;
      --accent-hover: #7390ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(91, 124, 250, .16), transparent 38%),
        var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 460px);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(16, 22, 37, .94);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .42);
    }

    .icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      border-radius: 15px;
      background: rgba(91, 124, 250, .14);
      color: var(--accent);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.6rem, 5vw, 2rem);
      line-height: 1.15;
      letter-spacing: -.025em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .notice {
      margin: 24px 0;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface-soft);
      font-size: .9rem;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .button {
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 0 18px;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
    }

    .button:active { transform: scale(.98); }

    .primary { background: var(--accent); color: white; }
    .primary:hover { background: var(--accent-hover); }
    .secondary { border-color: var(--border); background: transparent; color: var(--text); }
    .secondary:hover { background: var(--surface-soft); }
    .button[aria-disabled="true"] { opacity: .45; pointer-events: none; }

    .status {
      min-height: 22px;
      margin-top: 18px;
      text-align: center;
      font-size: .85rem;
    }

    @media (max-width: 420px) {
      main { padding: 24px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="icon" aria-hidden="true">
      <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h6v6"></path>
        <path d="M10 14 21 3"></path>
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
      </svg>
    </div>

    <h1 id="page-title">Continúa en tu televisor</h1>
    <p>¿Estás intentando iniciar sesión desde tu televisor? Usa este enlace para continuar con la aprobación del acceso.</p>

    <p class="notice">Al continuar, te enviaremos al enlace asociado a tu solicitud. Esta página es independiente y no solicita tu contraseña.</p>

    <div class="actions" id="actions">
      <a class="button primary" id="continue" href="#" rel="noopener noreferrer nofollow">Sí, continuar</a>
      <button class="button secondary" id="cancel" type="button">Ahora no</button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    (() => {
      const continueButton = document.getElementById("continue");
      const cancelButton = document.getElementById("cancel");
      const status = document.getElementById("status");
      const code = location.hash.slice(1).trim();

      if (code) {
        continueButton.href = "https://x.dsorak.com/" + encodeURIComponent(code);
      } else {
        continueButton.setAttribute("aria-disabled", "true");
        status.textContent = "El enlace está incompleto. Solicita uno nuevo.";
      }

      cancelButton.addEventListener("click", () => {
        document.getElementById("actions").hidden = true;
        status.textContent = "Operación cancelada. Ya puedes cerrar esta página.";
      });
    })();
  </script>
</body>
</html>
